[package]
name = "lean-snark-program"
version = "0.1.0"
edition = "2021"

[dependencies]
sp1-zkvm = { version = "6.0.1" }
nanoda_lib = { path = "../nanoda_lib" }
# SHA-256 of the input blob is committed alongside the declaration count so
# the SNARK binds to specific bytes (Layer 2). We use the plain `sha2` crate
# here; for production cycle counts, swap in SP1's SHA precompile via:
#   [patch.crates-io]
#   sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", branch = "patch-sha2-...", package = "sha2" }
sha2 = "0.10"
