[package]
name = "lean-snark-script"
version = "0.1.0"
edition = "2021"
default-run = "prove"

[[bin]]
name = "prove"
path = "src/bin/prove.rs"

[[bin]]
name = "check_native"
path = "src/bin/check_native.rs"

[dependencies]
sp1-sdk = { version = "6.0.1", features = ["blocking", "native-gnark"] }
nanoda_lib = { path = "../nanoda_lib" }
serde_json = "1.0"
serde = { version = "1.0.200", features = ["derive"] }
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1.40"
dotenv = "0.15.0"
sha2 = "0.10"
# Used to measure on-wire proof/vk sizes — gives the canonical byte length the
# verifier would ship around (proof.save() does this too but writes to disk).
bincode = "1.3"

[build-dependencies]
sp1-build = { version = "6.0.1" }
