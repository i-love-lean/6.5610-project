
[package]
name = "nanoda_lib"
version = "0.4.8-beta"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ammkrn/nanoda_lib"
description = "A type checker for the Lean 4 programming language and theorem prover"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
opt-level=3
overflow-checks=true
lto=true

[profile.test]
opt-level=3
overflow-checks=true

[dev-dependencies]
rand = "0.8.5"
num-bigint = { version = "0.4.4", features = ["rand", "serde"] }
sha2 = "0.10"

[dependencies]
indexmap = { version = "2.13.0", features = ["serde"] }
rustc-hash = "1.1.0"
num-bigint = { version = "0.4.4", features = ["serde"] }
num-integer = "0.1.46"
num-traits = "0.2.17"
semver = "1.0.27"
serde_json = "1.0.111"
serde = { version = "1.0.228", features = ["derive", "rc"] }
# bincode 1.3 for the host→guest flat-blob format used by zkvm_entry::check_export_from_flat_bytes.
bincode = "1.3"
# Used for the theorem anchor (Layer 4). Walks the last declar's name + type
# in canonical form and SHA-256s the bytes — anchors the SNARK to a specific
# theorem statement, independent of NDJSON ordering / DAG indexing.
sha2 = "0.10"

# `[[bin]] nanoda_bin` was removed for the SP1 port — nanoda_lib is now
# consumed only as a library crate by the SP1 guest.